name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every job reads only; the job that writes says what it needs
permissions:
  contents: read

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check-types

      - name: Unit tests
        run: npm test

      - name: Package the extension
        run: npm run package

      - name: Keep the .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goeasyerp-vsix
          path: '*.vsix'
          if-no-files-found: error

  # A development container's whole life, with Docker and the published images of the base
  integration:
    name: Container tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_VERSION: 0.1.197
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  release-please:
    name: Release
    needs: [build, integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # Trusted publishing: the Marketplace accepts this workflow's identity, so there is no token
  # to keep. The publisher's policy names this file; renaming it stops the publishing.
  publish:
    name: Publish to the Marketplace
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # No install scripts where the job can prove who it is
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The package that was checked and built above, not a second build
      - name: Fetch the .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: goeasyerp-vsix

      - name: Publish
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: npx --no-install vsce publish --oidc --skip-duplicate --packagePath "goeasyerp-$VERSION.vsix"
